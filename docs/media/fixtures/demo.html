<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin:0; font: 500 28px/1.5 -apple-system, "Segoe UI", sans-serif; color:#0f1115; background:#eef2ff; }
  .page { padding:56px 64px; }
  h1 { font-size:44px; margin:0 0 10px; letter-spacing:-0.02em; }
  p { margin:0 0 34px; color:#6b7280; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  .card { background:#fff; border:1px solid #e3e7ee; border-radius:16px; padding:26px; box-shadow:0 10px 30px rgba(16,24,40,.08); }
  .num { font: 700 40px/1 ui-monospace, Menlo, monospace; color:#2f43d9; }
  .label { margin-top:10px; color:#6b7280; font-size:20px; }
</style>
</head>
<body>
<div class="page">
  <h1>Weekly workspace report</h1>
  <p>Rendered by the built-in viewer — sandboxed HTML, relative assets resolve from the workspace.</p>
  <div class="grid">
    <div class="card"><div class="num">1,284</div><div class="label">files indexed</div></div>
    <div class="card"><div class="num">37</div><div class="label">file types</div></div>
    <div class="card"><div class="num">12 ms</div><div class="label">median search</div></div>
  </div>
</div>
</body>
</html>
