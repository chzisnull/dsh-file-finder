<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-file-finder · session board check</title>
<script>
  // Seed the plugin settings for the "off" scenarios before client.js reads them.
  (function () {
    var scenario = new URLSearchParams(location.search).get('settings') || ''
    if (!scenario) return
    var value = { sessionBoard: { enabled: true, region: true, shortcut: true } }
    if (scenario === 'off') value = { sessionBoard: { enabled: false, region: true, shortcut: true } }
    if (scenario === 'no-region') value = { sessionBoard: { enabled: true, region: false, shortcut: true } }
    if (scenario === 'no-shortcut') value = { sessionBoard: { enabled: true, region: true, shortcut: false } }
    try { localStorage.setItem('dsh-file-finder.settings.v1', JSON.stringify(value)) } catch (error) { /* ignore */ }
  })()
</script>
</head>
<body>
<div id="region-host"></div>
<div id="overlay-host"></div>
<script src="./vendor/react.development.js"></script>
<script src="./vendor/react-dom.development.js"></script>
<script src="./loader-shim.js"></script>
<script src="./fixtures/sessions.js"></script>
<script>
  // The one fake for the Host's session-activity route. It never reads a real
  // session: every record starts from the fixture below, and both actions the
  // client may use are answered in the shapes the Host promises.
  (function () {
    'use strict'
    var fixture = window.dffSessionFixture.create({ lang: 'zh', idleExtras: 60 })
    var records = {}
    var calls = []
    fixture.list.ids.forEach(function (id) {
      var summary = fixture.list.byId[id]
      records[id] = { activityAt: Number(summary.updatedAt) || 0, visitedAt: 0 }
    })
    function reply(payload) {
      return Promise.resolve(new Response(JSON.stringify(payload), {
        status: 200,
        headers: { 'content-type': 'application/json' },
      }))
    }
    function bodyOf(init) {
      if (!init || init.body === undefined || init.body === null) return {}
      if (typeof init.body !== 'string') return {}
      try { return JSON.parse(init.body) } catch (error) { return {} }
    }
    window.__DFF_FIXTURE__ = fixture
    window.__DFF_ACTIVITY__ = { calls: calls, records: records }
    window.fetch = function (input, init) {
      var url = String(typeof input === 'string' ? input : (input && input.url) || '')
      if (url.indexOf('/dsh-file-finder/session-activity') < 0) {
        return Promise.reject(new Error('unexpected fetch in the board check: ' + url))
      }
      var body = bodyOf(init)
      calls.push({
        method: String((init && init.method) || 'GET').toUpperCase(),
        action: body.action,
        id: body.id,
        ids: Array.isArray(body.ids) ? body.ids.slice() : [],
      })
      if (body.action === 'read') {
        var out = {}
        var ids = Array.isArray(body.ids) ? body.ids : []
        for (var index = 0; index < ids.length; index += 1) {
          var id = ids[index]
          out[id] = records[id] || { activityAt: 0, visitedAt: 0 }
        }
        return reply({ ok: true, records: out })
      }
      if (body.action === 'visit') {
        var visitedAt = Date.now()
        var known = records[body.id] || { activityAt: visitedAt, visitedAt: 0 }
        records[body.id] = { activityAt: known.activityAt || visitedAt, visitedAt: visitedAt }
        return reply({ ok: true, visitedAt: visitedAt })
      }
      return reply({ ok: false })
    }
  })()
</script>
<script src="../client.js"></script>
<script>
  (function () {
    'use strict'
    var results = []

    function check(name, ok, detail) {
      results.push({ name: name, ok: Boolean(ok), detail: detail === undefined ? null : String(detail) })
    }

    function text(node) { return node ? String(node.textContent || '') : '' }

    function observable(initial) {
      var value = initial
      var listeners = new Set()
      return {
        getSnapshot: function () { return value },
        subscribe: function (listener) {
          listeners.add(listener)
          return function () { listeners.delete(listener) }
        },
        set: function (next) {
          value = next
          listeners.forEach(function (listener) { listener() })
        },
      }
    }

    function secondsAgo(seconds) { return Date.now() - seconds * 1000 }

    // Three states DSH models, plus the three rows that must never be counted.
    // One dataset for every preview surface (preview/fixtures/sessions.js); the
    // 60 idle extras exercise Recent without touching the count expectations.
    var fixture = window.__DFF_FIXTURE__
    var activity = window.__DFF_ACTIVITY__
    var sessions = observable(fixture.list)
    var statuses = observable(fixture.statuses)
    var workspaces = observable(fixture.workspaces)
    var expected = fixture.expected
    var openedSessions = []
    var ctx = {
      effect: function (fn) { try { var off = fn(); return function () { try { if (typeof off === 'function') off() } catch (e) {} } } catch (e) { return function () {} } },
      get: function (name) {
        if (name === 'sessions') return { list: sessions }
        if (name === 'uiSession') return { sessionStatus: statuses }
        if (name === 'workspaces') return { list: workspaces }
        if (name === 'uiWorkspace') { return { openSession: function (id) { openedSessions.push(id) } } }
        return undefined
      },
      inject: function (names, callback) {
        callback({ effect: ctx.effect, shortcuts: { register: function () { return function () {} } } })
      },
      locale: { register: function () {}, bind: function () { return function (key) { return key } } },
      slots: { inject: function (name, callback) { callback() }, register: function () { return function () {} } },
    }

    var registered = []
    ctx.slots = {
      inject: function (name, callback) { callback() },
      register: function (entry, component) {
        registered.push({ entry: entry, component: component })
        return function () {}
      },
    }

    function waitFor(checkFn, timeout) {
      var started = performance.now()
      return new Promise(function (resolve, reject) {
        (function poll() {
          var value = null
          try { value = checkFn() } catch (error) { value = null }
          if (value) { resolve(value); return }
          if (performance.now() - started > (timeout || 4000)) { reject(new Error('timed out waiting for a selector')); return }
          setTimeout(poll, 25)
        })()
      })
    }

    // A failed wait is a failed check, not a reason to stop reporting the rest.
    function settled(checkFn, timeout) {
      return waitFor(checkFn, timeout).catch(function () { return null })
    }

    function setInput(input, value) {
      var setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set
      setter.call(input, value)
      input.dispatchEvent(new Event('input', { bubbles: true }))
    }

    function pressBoardShortcut() {
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'g', code: 'KeyG', metaKey: true, shiftKey: true, bubbles: true, cancelable: true }))
    }

    function board() { return document.querySelector('[data-dff-board]') }
    function region() { return document.querySelector('[data-dff-region]') }
    function columns() { return Array.prototype.slice.call(document.querySelectorAll('[data-dff-board-col]')) }

    // The sidebar's Recent action: named explicitly by the agreed selector, but
    // the state attribute is accepted too so the check survives a rename that
    // still means "the fourth, always-on control".
    function recentControl() {
      var node = region()
      if (!node) return null
      return node.querySelector('[data-dff-region-recent]') || node.querySelector('[data-state="recent"]')
    }

    function recentEntries() {
      var node = board()
      return node ? Array.prototype.slice.call(node.querySelectorAll('[data-dff-recent-entry]')) : []
    }

    function visible(node) {
      if (!node) return false
      if (!node.getClientRects().length) return false
      var style = getComputedStyle(node)
      return style.visibility !== 'hidden' && style.display !== 'none'
    }

    function shownRecent() {
      return recentEntries().filter(visible)
    }

    function activityCalls(action) {
      return activity.calls.filter(function (call) { return !action || call.action === action })
    }

    ;(async function run() {
      var moduleExports = window.__DFF_MODULE__
      await moduleExports.apply(ctx)

      var Region = null
      var Overlay = null
      registered.forEach(function (item) {
        if (item.entry.name === 'sidebar.footer.action') Region = item.component
        if (item.entry.name === 'shell.overlay' && item.entry.id === 'file-finder-board') Overlay = item.component
      })

      var regionRoot = ReactDOM.createRoot(document.getElementById('region-host'))
      var overlayRoot = ReactDOM.createRoot(document.getElementById('overlay-host'))
      regionRoot.render(React.createElement(Region, { wide: true }))
      overlayRoot.render(React.createElement(Overlay, {}))
      await waitFor(region)

      // ── Counts ────────────────────────────────────────────────────────────
      var pills = region().querySelectorAll('[data-dff-region-pill], .dff-region-pill')
      check('the region renders one pill per state', pills.length === 3, pills.length)
      var counts = {}
      Array.prototype.forEach.call(pills, function (pill) { counts[pill.getAttribute('data-state')] = pill.getAttribute('data-count') })
      check('pending counts only sessions awaiting the user', counts.pending === String(expected.pending), counts.pending)
      check('running counts only live sessions', counts.running === String(expected.running), counts.running)
      check('finished counts only unread completions', counts.finished === String(expected.finished), counts.finished)
      // The three numbers add up to the seven actionable sessions only: the
      // blank row, the subagent row and the archived row contribute nothing.
      check('blank, subagent and archived sessions stay out of every count',
        Number(counts.pending) + Number(counts.running) + Number(counts.finished) === 11,
        JSON.stringify(counts))

      // Subagents bubble up instead of owning a count: r3's own Agent is idle
      // but two subagents run, p4's own Agent is idle but a subagent waits.
      region().querySelector('[data-state="running"]').click()
      await waitFor(board)
      var r3Row = board().querySelector('[data-dff-board-row="r3"]')
      check('a running subagent keeps its parent running', Boolean(r3Row))
      check('the row names how many subagents are running',
        Boolean(r3Row) && text(r3Row).indexOf('subagentCount') >= 0, r3Row ? text(r3Row) : '')
      check('the parent counts once, not once per subagent', columns().length === 3
        && board().querySelectorAll('[data-state="running"] [data-dff-board-row]').length === 5,
        board().querySelectorAll('[data-state="running"] [data-dff-board-row]').length)
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
      await waitFor(function () { return !board() })
      region().querySelector('[data-state="pending"]').click()
      await waitFor(board)
      var p4Row = board().querySelector('[data-dff-board-row="p4"]')
      check('a waiting subagent surfaces its parent as awaiting', Boolean(p4Row))
      check('the waiting row says the subagent needs you',
        Boolean(p4Row) && text(p4Row).indexOf('pendingSubagent') >= 0, p4Row ? text(p4Row) : '')
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
      await waitFor(function () { return !board() })

      // ── Filtered open from a pill ─────────────────────────────────────────
      region().querySelector('[data-state="pending"]').click()
      await waitFor(board)
      check('a pill opens the board', Boolean(board()))
      check('a pill opens every column, never a pre-filtered one', columns().length === 3,
        columns().map(function (c) { return c.getAttribute('data-state') }).join(','))
      check('the board header carries no counts of its own', !board().querySelector('.dff-board-title span'))
      var rows = board().querySelectorAll('[data-state="pending"] [data-dff-board-row]')
      check('the pending column lists every waiting session', rows.length === 4, rows.length)
      check('the longest wait comes first', rows.length === 4 && rows[0].getAttribute('data-dff-board-row') === 'p3',
        rows.length ? rows[0].getAttribute('data-dff-board-row') : '')
      check('a waiting row names the reason', text(rows[0]).indexOf('pendingPlan') >= 0, text(rows[0]))

      // ── Navigating from a row ─────────────────────────────────────────────
      rows[0].click()
      await new Promise(function (resolve) { setTimeout(resolve, 200) })
      check('a row opens the session through uiWorkspace', openedSessions.length === 1 && openedSessions[0] === 'p3', openedSessions.join(','))
      check('opening a session closes the board', !board())

      // ── Shortcut ──────────────────────────────────────────────────────────
      pressBoardShortcut()
      await waitFor(board)
      check('the shortcut opens the board', Boolean(board()))
      check('the shortcut opens with every column', columns().length === 3, columns().length)
      check('columns keep their own state', columns().map(function (c) { return c.getAttribute('data-state') }).join(',') === 'pending,running,finished')

      // ── Search ────────────────────────────────────────────────────────────
      var input = board().querySelector('.dff-board-search input')
      setInput(input, 'CI')
      await new Promise(function (resolve) { setTimeout(resolve, 80) })
      var runningRows = board().querySelector('[data-state="running"]').querySelectorAll('[data-dff-board-row]')
      check('search narrows the columns', runningRows.length === 1, runningRows.length)
      check('a column with no match says so', text(board().querySelector('[data-state="pending"]')).indexOf('boardNoMatch') >= 0)
      setInput(input, '')
      await new Promise(function (resolve) { setTimeout(resolve, 80) })

      setInput(input, '接口服务')
      await new Promise(function (resolve) { setTimeout(resolve, 80) })
      var byWorkspace = board().querySelectorAll('[data-dff-board-row]')
      check('search also matches the workspace title', byWorkspace.length === 3, byWorkspace.length)
      setInput(input, '')
      await new Promise(function (resolve) { setTimeout(resolve, 80) })

      // ── Escape ────────────────────────────────────────────────────────────
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
      await waitFor(function () { return !board() })
      check('Escape closes the board', !board())

      // ── Live update ───────────────────────────────────────────────────────
      var next = new Map(statuses.getSnapshot())
      next.set('p1', { running: false, pendingInteraction: undefined, completionUnread: true })
      statuses.set(next)
      await new Promise(function (resolve) { setTimeout(resolve, 80) })
      var live = {}
      Array.prototype.forEach.call(region().querySelectorAll('.dff-region-pill'), function (pill) {
        live[pill.getAttribute('data-state')] = pill.getAttribute('data-count')
      })
      check('the counts follow DSH status changes without a reload',
        live.pending === String(expected.pending - 1)
        && live.running === String(expected.running)
        && live.finished === String(expected.finished + 1), JSON.stringify(live))

      // ── Collapsed rail ────────────────────────────────────────────────────
      regionRoot.render(React.createElement(Region, { wide: false }))
      await new Promise(function (resolve) { setTimeout(resolve, 60) })
      var rail = region()
      check('the rail variant keeps the three states', rail && rail.getAttribute('data-wide') === 'false')
      var label = rail.querySelector('.dff-region-label')
      check('the rail hides the labels and keeps the numbers', label && getComputedStyle(label).display === 'none',
        label ? getComputedStyle(label).display : 'no label')

      // ── Two tabs: the status board and the recent list ────────────────────
      regionRoot.render(React.createElement(Region, { wide: true }))
      await waitFor(function () { return region() && region().getAttribute('data-wide') === 'true' })

      pressBoardShortcut()
      await waitFor(board)
      var statusTab = board().querySelector('[data-dff-board-tab="status"]')
      var recentTab = board().querySelector('[data-dff-board-tab="recent"]')
      check('the board offers a status tab and a recent tab', Boolean(statusTab && recentTab))
      check('the shortcut opens the board on the status tab',
        Boolean(statusTab) && statusTab.getAttribute('aria-selected') === 'true'
        && Boolean(recentTab) && recentTab.getAttribute('aria-selected') === 'false',
        statusTab ? statusTab.getAttribute('aria-selected') : 'no status tab')
      check('both tabs carry the tab role and sit in a tablist',
        Boolean(statusTab && recentTab)
        && statusTab.getAttribute('role') === 'tab'
        && recentTab.getAttribute('role') === 'tab'
        && Boolean(statusTab.closest('[role="tablist"]')))
      if (statusTab) statusTab.focus()
      check('a tab can take focus', Boolean(statusTab) && document.activeElement === statusTab)
      check('the status tab shows its columns', visible(board().querySelector('[data-dff-board-col]')))

      // Standard tab keyboard behaviour: arrows move the selection, so the
      // board is usable without a pointer (the board's own open effect still
      // decides where focus lands, which is why focus is checked separately).
      if (statusTab) {
        statusTab.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }))
      }
      await settled(function () {
        return board() && board().querySelector('[data-dff-board-tab="recent"][aria-selected="true"]')
      })
      check('ArrowRight moves the tabs to recent',
        Boolean(board() && board().querySelector('[data-dff-board-tab="recent"][aria-selected="true"]')))
      var recentByKey = board() ? board().querySelector('[data-dff-board-tab="recent"]') : null
      if (recentByKey) {
        recentByKey.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft', bubbles: true, cancelable: true }))
      }
      await settled(function () {
        return board() && board().querySelector('[data-dff-board-tab="status"][aria-selected="true"]')
      })
      check('ArrowLeft moves the tabs back to status',
        Boolean(board() && board().querySelector('[data-dff-board-tab="status"][aria-selected="true"]')))

      recentTab = board().querySelector('[data-dff-board-tab="recent"]')
      if (recentTab) recentTab.click()
      await settled(function () {
        return board() && board().querySelector('[data-dff-board-tab="recent"][aria-selected="true"]')
      })
      await settled(function () { return shownRecent().length > 0 })
      check('clicking a tab switches the board to recent',
        Boolean(board() && board().querySelector('[data-dff-board-tab="recent"][aria-selected="true"]')))
      check('the recent tab renders recent entries', shownRecent().length > 0, shownRecent().length)
      var firstRecent = shownRecent()[0]
      if (firstRecent) firstRecent.focus()
      check('a recent entry can take focus', Boolean(firstRecent) && document.activeElement === firstRecent)

      var statusTabNow = board().querySelector('[data-dff-board-tab="status"]')
      if (statusTabNow) statusTabNow.click()
      await settled(function () {
        return board() && board().querySelector('[data-dff-board-tab="status"][aria-selected="true"]')
      })
      check('switching back shows the status columns again', visible(board().querySelector('[data-dff-board-col]')))
      var recentTabNow = board().querySelector('[data-dff-board-tab="recent"]')
      if (recentTabNow) recentTabNow.click()
      await settled(function () { return shownRecent().length > 0 })

      // The Host seam: the recent view asks for activity records in the shape
      // preview/fixtures/sessions.js seeded, never for real user data.
      var readSeen = Boolean(await settled(function () {
        return activityCalls('read').some(function (call) { return call.ids.length > 0 })
      }, 1500))
      check('the board asks the Host for session activity records', readSeen)

      // ── The recent list: one page, cross-workspace, no leftovers ──────────
      await settled(function () { return shownRecent().length === 50 ? true : null })
      var pageOne = shownRecent()
      check('the recent list starts with one page of 50', pageOne.length === 50, pageOne.length)
      // A full page must scroll inside the dialog instead of growing past it:
      // the list is longer than the board, so the wheel has to stay inside.
      var recentScroller = board() ? board().querySelector('.dff-recent-scroll') : null
      var boardBox = board() ? board().getBoundingClientRect() : null
      var scrollerBox = recentScroller ? recentScroller.getBoundingClientRect() : null
      check('the recent list scrolls inside the dialog',
        Boolean(scrollerBox && boardBox)
        && recentScroller.scrollHeight > recentScroller.clientHeight + 1
        && scrollerBox.bottom <= boardBox.bottom + 1,
        recentScroller
          ? recentScroller.scrollHeight + '>' + recentScroller.clientHeight
            + ' bottom ' + Math.round(scrollerBox.bottom) + '/' + Math.round(boardBox.bottom)
          : 'no scroller')
      // The page control is a rail pinned under the list, so it is reachable
      // without scrolling to the bottom of the page (and does not scroll away).
      var foot = board() ? board().querySelector('.dff-recent-foot') : null
      var footBox = foot ? foot.getBoundingClientRect() : null
      check('the page control sits on a rail under the list, not in the scroll',
        Boolean(foot && footBox && boardBox)
        && Math.abs(footBox.bottom - boardBox.bottom) < 3,
        footBox ? 'foot bottom ' + Math.round(footBox.bottom) + ' board ' + Math.round(boardBox.bottom) : 'no rail')
      check('the rail carries the progress text and the page button',
        Boolean(foot
          && foot.querySelector('[data-dff-recent-progress]')
          && foot.querySelector('[data-dff-recent-more]')),
        foot ? text(foot) : '')
      var more = board() ? board().querySelector('[data-dff-recent-more]') : null
      check('a full recent page offers a way to see more', Boolean(more))
      var pageIds = pageOne.map(function (entry) { return entry.getAttribute('data-dff-recent-entry') })
      check('the recent list spans workspaces',
        fixture.recent.acrossWorkspaces.length === 4
        && fixture.recent.acrossWorkspaces.every(function (id) { return pageIds.indexOf(id) >= 0 }),
        fixture.recent.acrossWorkspaces.map(function (id) {
          return id + (pageIds.indexOf(id) >= 0 ? '=yes' : '=no')
        }).join(','))
      check('blank, subagent and archived sessions stay out of the recent list',
        pageIds.indexOf('blank') < 0 && pageIds.indexOf('sub') < 0
        && pageIds.indexOf('sa1') < 0 && pageIds.indexOf('old') < 0,
        pageIds.filter(function (id) { return ['blank', 'sub', 'sa1', 'old'].indexOf(id) >= 0 }).join(','))

      // ── Search reaches past the first page and by workspace ───────────────
      var searchInput = board().querySelector('.dff-board-search input')
      check('the board keeps its search box', Boolean(searchInput))
      if (searchInput) setInput(searchInput, fixture.recent.doneReadTitle)
      await settled(function () { return shownRecent().length === 1 })
      var searched = shownRecent()
      check('search finds a recent session beyond the first page',
        searched.length === 1
        && searched[0].getAttribute('data-dff-recent-entry') === fixture.recent.doneReadId,
        searched.length ? searched[0].getAttribute('data-dff-recent-entry') : 'none')
      if (searchInput) setInput(searchInput, fixture.recent.doneReadWorkspaceTitle)
      await settled(function () {
        return shownRecent().some(function (entry) {
          return entry.getAttribute('data-dff-recent-entry') === fixture.recent.doneReadId
        })
      })
      var byWorkspace = shownRecent().map(function (entry) { return entry.getAttribute('data-dff-recent-entry') })
      check('search matches the workspace title and keeps later records',
        byWorkspace.indexOf(fixture.recent.doneReadId) >= 0, byWorkspace.slice(0, 8).join(','))
      if (searchInput) setInput(searchInput, '')
      await settled(function () { return shownRecent().length === 50 })
      check('clearing the query restores the first page', shownRecent().length === 50, shownRecent().length)

      // ── "Show more" reaches the older rows ────────────────────────────────
      var moreNow = board().querySelector('[data-dff-recent-more]')
      if (moreNow) moreNow.click()
      await settled(function () { return shownRecent().length > 50 })
      var allIds = shownRecent().map(function (entry) { return entry.getAttribute('data-dff-recent-entry') })
      check('show more reveals the rest of the recent list', allIds.length > 50, allIds.length)
      check('the finished-and-read idle session becomes reachable after more',
        allIds.indexOf(fixture.recent.doneReadId) >= 0)
      check('blank, subagent and archived sessions stay out after show more too',
        allIds.indexOf('blank') < 0 && allIds.indexOf('sub') < 0
        && allIds.indexOf('sa1') < 0 && allIds.indexOf('old') < 0)

      // ── Navigating from a recent entry ────────────────────────────────────
      var target = board()
        ? board().querySelector('[data-dff-recent-entry="' + fixture.recent.doneReadId + '"]')
        : null
      check('the finished-and-read idle session has a recent entry', Boolean(target))
      if (target) target.click()
      await settled(function () { return !board() })
      check('a recent entry opens the session through uiWorkspace',
        openedSessions[openedSessions.length - 1] === fixture.recent.doneReadId, openedSessions.join(','))
      var visitSeen = Boolean(await settled(function () {
        return activityCalls('visit').some(function (call) { return call.id === fixture.recent.doneReadId })
      }, 1500))
      check('opening a recent entry records the visit on the Host', visitSeen)
      check('both activity actions use POST',
        activityCalls('read').length > 0 && activityCalls('visit').length > 0
        && activity.calls.every(function (call) { return call.method === 'POST' }))
      if (board()) {
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
        await settled(function () { return !board() })
      }

      // ── Zero counts: the sidebar still reaches the recent tab ─────────────
      var listNow = sessions.getSnapshot()
      var byIdNow = {}
      Object.keys(listNow.byId).forEach(function (id) {
        byIdNow[id] = Object.assign({}, listNow.byId[id], { running: false })
      })
      sessions.set(Object.assign({}, listNow, { byId: byIdNow }))
      statuses.set(new Map())
      var zeroed = await settled(function () {
        var pillsNow = region().querySelectorAll('[data-dff-region-pill], .dff-region-pill')
        if (pillsNow.length !== 3) return null
        for (var pillIndex = 0; pillIndex < pillsNow.length; pillIndex += 1) {
          if (pillsNow[pillIndex].getAttribute('data-count') !== '0') return null
        }
        return pillsNow
      })
      check('every sidebar count can reach zero', Boolean(zeroed))
      check('the zero-count pills disable themselves',
        Boolean(zeroed) && Array.prototype.every.call(zeroed, function (pill) { return pill.disabled }))
      var recentButton = recentControl()
      check('the sidebar keeps a recent control when every count is zero', Boolean(recentButton))
      check('the recent control is enabled at zero', Boolean(recentButton) && !recentButton.disabled)
      if (recentButton) recentButton.click()
      await settled(board)
      var selectedTab = board() ? board().querySelector('[data-dff-board-tab][aria-selected="true"]') : null
      check('the sidebar recent control opens the board on the recent tab',
        Boolean(selectedTab) && selectedTab.getAttribute('data-dff-board-tab') === 'recent',
        selectedTab ? selectedTab.getAttribute('data-dff-board-tab') : 'no tab')
      await settled(function () { return shownRecent().length > 0 })
      check('idle sessions stay findable at zero counts', shownRecent().length > 0, shownRecent().length)
      var zeroInput = board() ? board().querySelector('.dff-board-search input') : null
      if (zeroInput) setInput(zeroInput, fixture.recent.doneReadTitle)
      await settled(function () { return shownRecent().length === 1 })
      check('the finished-and-read idle session is still findable at zero counts',
        shownRecent().length === 1
        && shownRecent()[0].getAttribute('data-dff-recent-entry') === fixture.recent.doneReadId,
        shownRecent().length)

      // ── Escape still belongs to the recent board ──────────────────────────
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
      await settled(function () { return !board() })
      check('Escape closes the recent board', !board())

      window.__SESSION_BOARD_CHECK__ = {
        passed: results.every(function (item) { return item.ok }),
        results: results,
      }
    })().catch(function (error) {
      window.__SESSION_BOARD_CHECK__ = {
        passed: false,
        results: results,
        error: String(error && error.stack ? error.stack : error),
      }
    })
  })()
</script>
</body>
</html>
