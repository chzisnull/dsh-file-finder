<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-file-finder · browse mode check</title>
<script>
  // Fake workspace for the empty-query directory browser.
  var LIST = {
    '/ws': [
      { name: 'src', path: '/ws/src', type: 'dir' },
      { name: 'docs', path: '/ws/docs', type: 'dir' },
      { name: 'README.md', path: '/ws/README.md', type: 'file' },
      { name: 'package.json', path: '/ws/package.json', type: 'file' },
    ],
    '/ws/src': [
      { name: 'api', path: '/ws/src/api', type: 'dir' },
      { name: 'components', path: '/ws/src/components', type: 'dir' },
      { name: 'App.vue', path: '/ws/src/App.vue', type: 'file' },
      { name: 'main.ts', path: '/ws/src/main.ts', type: 'file' },
    ],
    '/ws/src/api': [
      { name: 'survey.ts', path: '/ws/src/api/survey.ts', type: 'file' },
    ],
    '/ws/src/components': [],
    '/ws/docs': [
      { name: 'guide.md', path: '/ws/docs/guide.md', type: 'file' },
      { name: 'page.html', path: '/ws/docs/page.html', type: 'file' },
    ],
  }
  var PARENT = {
    '/ws': null,
    '/ws/src': '/ws',
    '/ws/src/api': '/ws/src',
    '/ws/src/components': '/ws/src',
    '/ws/docs': '/ws',
  }
  var TEXTS = {
    '/ws/src/App.vue': '<template>\n  <div>hello</div>\n</template>\n',
    '/ws/docs/guide.md': '# Guide\n\nRead me.\n',
  }
  // Media and unsupported-kind fixtures for the routing matrix. They live in
  // the workspace root so directory browsing lists them, and a name search
  // finds them by exact file name, which is how the matrix opens them without
  // a long run of ArrowDown keys.
  var EXTRA_FILES = [
    { name: 'logo.png', kind: 'image', bytes: 2048 },
    { name: 'clip.mp4', kind: 'video', bytes: 4096 },
    { name: 'voice.mp3', kind: 'audio', bytes: 1024 },
    { name: 'manual.pdf', kind: 'pdf', bytes: 512 },
    { name: 'diagram.html', kind: 'html', text: '<!doctype html><h1>fixture</h1>', bytes: 34 },
    { name: 'notes.md', kind: 'markdown', text: '# Notes\n\nFixture text.\n', bytes: 22 },
    { name: 'report.docx', kind: 'binary', bytes: 2048 },
    { name: 'bundle.zip', kind: 'binary', bytes: 1024 },
    { name: 'data.bin', kind: 'binary', bytes: 32 },
  ]
  var FIXTURES = {}
  EXTRA_FILES.forEach(function (file) {
    file.path = '/ws/' + file.name
    LIST['/ws'].push({ name: file.name, path: file.path, type: 'file' })
    FIXTURES[file.path] = file
  })
  function response(body) {
    return { ok: true, status: 200, json: function () { return Promise.resolve(body) } }
  }
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || ''
    var path = url
    try { path = new URL(url, location.href).pathname } catch (error) { /* raw */ }
    var body = {}
    try { if (init && typeof init.body === 'string') body = JSON.parse(init.body) } catch (error) { body = {} }
    if (path === '/dsh-file-finder/roots') {
      return Promise.resolve(response({ ok: true, roots: [{ path: '/ws', title: 'ws', source: 'workspace' }], current: '/ws' }))
    }
    if (path === '/dsh-file-finder/list') {
      var dir = String(body.path || '/ws')
      var entries = LIST[dir] || []
      var crumbs = [{ label: 'ws', path: '/ws' }]
      var accumulated = '/ws'
      if (dir !== '/ws') {
        dir.slice('/ws'.length).replace(/^\/+/, '').split('/').forEach(function (segment) {
          if (!segment) return
          accumulated = accumulated + '/' + segment
          crumbs.push({ label: segment, path: accumulated })
        })
      }
      return Promise.resolve(response({
        ok: true, root: '/ws', path: dir, parent: PARENT[dir] === undefined ? null : PARENT[dir],
        total: entries.length, truncated: false, entries: entries, crumbs: crumbs,
      }))
    }
    if (path === '/dsh-file-finder/search-name') {
      var query = String(body.query || '')
      var fixture = EXTRA_FILES.filter(function (file) { return file.name === query })[0]
      var results = fixture
        ? [{ path: fixture.path, name: fixture.name, score: 0 }]
        : query.toLowerCase().indexOf('main') === 0
          ? [{ path: '/ws/src/main.ts', name: 'main.ts', score: 0 }]
          : []
      return Promise.resolve(response({ ok: true, mode: 'name', root: '/ws', truncated: false, results: results }))
    }
    if (path === '/dsh-file-finder/read') {
      var entry = FIXTURES[body.path]
      if (entry) {
        return Promise.resolve(response({
          ok: true, path: body.path, version: '1', bytes: entry.bytes,
          kind: entry.kind, text: entry.text || '',
        }))
      }
      var html = String(body.path).slice(-5) === '.html'
      var text = html ? '' : (TEXTS[body.path] || 'plain text\n')
      return Promise.resolve(response({
        ok: true, path: body.path, version: '1', bytes: text.length,
        kind: html ? 'html' : 'text', text: text,
      }))
    }
    return Promise.resolve(response({ ok: false, error: 'unexpected ' + path }))
  }
</script>
<script>
  // Seed the plugin's persisted settings before client.js reads localStorage,
  // the way a DSH user who already chose an Open mode would have them. The
  // fixture defaults to `editor` so the browse flow below keeps opening files
  // in the writable editor; `?openMode=` drives the native, viewer or legacy
  // `preview` value instead (the legacy one must still mean native).
  (function () {
    try {
      var requested = new URLSearchParams(location.search).get('openMode')
      var seeded = requested === 'native' || requested === 'viewer' || requested === 'editor' || requested === 'preview'
        ? requested
        : 'editor'
      localStorage.setItem('dsh-file-finder.settings.v1', JSON.stringify({
        caseSensitive: false,
        extraIgnore: '',
        nameLimit: 40,
        contentLimit: 80,
        openMode: seeded,
      }))
    } catch (error) { /* file:// or private mode */ }
  })()
</script>
</head>
<body>
<div id="host"></div>
<script src="./vendor/react.development.js"></script>
<script src="./vendor/react-dom.development.js"></script>
<script src="./loader-shim.js"></script>
<script src="../client.js"></script>
<script>
  (function () {
    'use strict'
    var results = []
    var shortcuts = []
    var slots = []
    // The root gains the media/unsupported fixtures appended above, so tests
    // compare against the fixture itself instead of a hardcoded row count.
    var ROOT_NAMES = LIST['/ws'].map(function (entry) { return entry.name }).join(',')
    var ROOT_ROW_COUNT = LIST['/ws'].length
    var SRC_ROW_COUNT = LIST['/ws/src'].length

    function check(name, ok, detail) {
      results.push({ name: name, ok: Boolean(ok), detail: detail === undefined ? null : String(detail) })
    }

    function text(node) { return node ? String(node.textContent || '') : '' }

    function setInputValue(input, value) {
      var setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set
      setter.call(input, value)
      input.dispatchEvent(new Event('input', { bubbles: true }))
    }

    async function waitFor(checkFn, timeout) {
      var started = performance.now()
      for (;;) {
        var value = null
        try { value = checkFn() } catch (error) { value = null }
        if (value) return value
        if (performance.now() - started > (timeout || 4000)) throw new Error('timed out waiting for a selector')
        await new Promise(function (resolve) { setTimeout(resolve, 30) })
      }
    }

    function rows() {
      return Array.prototype.slice.call(document.querySelectorAll('[data-dff-browse]'))
    }

    function rowNames() {
      return rows().map(function (node) { return text(node.querySelector('.dff-result-name')) })
    }

    function crumbText() {
      var bar = document.querySelector('[data-dff-crumbs]')
      return bar ? text(bar) : ''
    }

    async function key(key, options) {
      var input = document.querySelector('[data-dff-input]')
      input.dispatchEvent(new KeyboardEvent('keydown', Object.assign({
        key: key, code: key, bubbles: true, cancelable: true,
      }, options || {})))
      await new Promise(function (resolve) { setTimeout(resolve, 260) })
    }

    // Records what the plugin asks DSH's right sidebar to open, so a check can
    // tell the native preview apart from the built-in viewer/editor.
    var sidebarOpens = []
    var sidebarRight = {
      openResource: function (address, options) {
        sidebarOpens.push({ address: address, options: options || null })
      },
    }
    // The live Session is what gives the address its `session/<id>` segment.
    var sessions = {
      list: {
        getSnapshot: function () {
          return {
            ids: ['ses_demo'],
            byId: {
              ses_demo: { id: 'ses_demo', cwd: '/ws', retainedBy: { mainView: 1 } },
            },
          }
        },
        subscribe: function () { return function () {} },
      },
    }

    // A host without the right sidebar: `?sidebar=off` makes the service absent
    // so the native branch has to fall back, the way a bare DSH would.
    var sidebarAvailable = new URLSearchParams(location.search).get('sidebar') !== 'off'

    var ctx = {
      effect: function (fn) { try { fn() } catch (e) {} return function () {} },
      get: function (name) {
        if (name === 'sidebarRight') return sidebarAvailable ? sidebarRight : undefined
        if (name === 'sessions') return sessions
        return undefined
      },
      inject: function (names, callback) {
        callback({
          effect: ctx.effect,
          shortcuts: { register: function (command) { shortcuts.push(command); return function () {} } },
        })
      },
      locale: { register: function () {}, bind: function () { return function (key) { return key } } },
      slots: {
        inject: function (name, callback) { callback() },
        register: function (entry, component) { slots.push({ entry: entry, component: component }); return function () {} },
      },
    }
    window.__DFF_SIDEBAR_OPENS__ = sidebarOpens

    ;(async function run() {
      var moduleExports = window.__DFF_MODULE__
      await moduleExports.apply(ctx)
      var overlay = slots.filter(function (slot) { return slot.entry && slot.entry.name === 'shell.overlay' })[0]
      ReactDOM.createRoot(document.getElementById('host')).render(React.createElement(overlay.component, {}))
      await new Promise(function (resolve) { setTimeout(resolve, 50) })

      var shortcut = shortcuts.filter(function (command) { return command.id === 'files.searchName' })[0]
      shortcut.resolve().run()
      var input = await waitFor(function () { return document.querySelector('[data-dff-input]') })

      // ── Root listing ────────────────────────────────────────────────────
      await waitFor(function () { return rows().length }, 5000)

      var params = new URLSearchParams(location.search)
      var scenario = params.get('scenario')

      function panel() { return document.querySelector('[data-dff-palette]') }
      function surfaceName() {
        return panel() ? panel().getAttribute('data-surface') : 'closed'
      }
      // The panel's own surface attributes, not the presence of a textarea:
      // the media Viewer renders no textarea, yet it is still the Viewer.
      function readOnlySurface() {
        return Boolean(panel()) && panel().getAttribute('data-readonly') === 'true'
      }
      function editorValue() {
        var area = document.querySelector('[data-dff-editor]')
        return area ? area.value : ''
      }
      function hasSave() { return Boolean(document.querySelector('.dff-save')) }

      // Escape walks back one screen at a time (surface → search → closed), so
      // closing from any surface may need more than one key.
      async function closePalette() {
        for (var step = 0; step < 3 && panel(); step += 1) {
          document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
          await new Promise(function (resolve) { setTimeout(resolve, 250) })
        }
        await waitFor(function () { return !panel() }, 5000)
      }

      // A fresh palette proves selection resets to the first row.
      async function freshPalette() {
        await closePalette()
        shortcut.resolve().run()
        await waitFor(function () { return panel() && rowNames().length === ROOT_ROW_COUNT }, 5000)
      }

      // Move the selection to a row by name. Root rows sort folders first;
      // package.json stays the text fixture even though media rows were added.
      async function selectRow(name) {
        var target = rowNames().indexOf(name)
        if (target < 0) throw new Error('row not found: ' + name)
        for (var index = 0; index < target; index += 1) await key('ArrowDown')
      }

      async function selectTextFile() {
        await selectRow('package.json')
      }

      // Kind-matrix helpers. Opening by exact name keeps the enlarged root
      // fixture from turning every case into a dozen ArrowDowns; Esc returns
      // to the same search result so both keys can be checked with one search.
      async function ensureSearch() {
        if (!panel()) {
          shortcut.resolve().run()
          await waitFor(function () { return Boolean(document.querySelector('[data-dff-input]')) }, 5000)
        } else if (!document.querySelector('[data-dff-input]')) {
          document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
          await waitFor(function () { return Boolean(document.querySelector('[data-dff-input]')) }, 5000)
        }
      }

      async function openByName(name, secondary) {
        await ensureSearch()
        setInputValue(document.querySelector('[data-dff-input]'), name)
        await waitFor(function () {
          var row = document.querySelector('[data-dff-result]')
          return row && text(row.querySelector('.dff-result-name')) === name
        }, 5000)
        // The debounced search ignores Enter while it is busy, and Escaping out
        // of a Viewer restarts that search; let it settle before pressing.
        await new Promise(function (resolve) { setTimeout(resolve, 300) })
        await key('Enter', secondary ? { metaKey: true, ctrlKey: true } : undefined)
      }

      async function escapeBackToSearch() {
        document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
        await waitFor(function () { return Boolean(document.querySelector('[data-dff-input]')) }, 5000)
      }

      // ── Open-mode matrix: text × mode × Enter/Cmd-Ctrl+Enter ───────────
      // The expected table comes straight from the spec, independent of the
      // implementation: Enter follows the stored mode and Cmd/Ctrl+Enter is
      // always the other side of view/edit.
      if (scenario === 'open-matrix') {
        var mode = params.get('openMode')
        var EXPECT = {
          native: { primary: 'native', secondary: 'editor' },
          viewer: { primary: 'viewer', secondary: 'editor' },
          editor: { primary: 'editor', secondary: 'native' },
        }[mode]
        check('the fixture seeded a known Open mode', Boolean(EXPECT), String(mode))

        async function openOnce(secondary, expected) {
          await freshPalette()
          await selectTextFile()
          var before = sidebarOpens.length
          var label = secondary ? 'Cmd/Ctrl+Enter' : 'Enter'
          await key('Enter', secondary ? { metaKey: true, ctrlKey: true } : undefined)
          if (expected === 'native') {
            await waitFor(function () { return sidebarOpens.length === before + 1 }, 5000)
            await waitFor(function () { return !panel() }, 5000)
            check(label + ' asks for the native preview',
              sidebarOpens[before].address === 'dsh-resource://file/session/ses_demo/package.json',
              sidebarOpens[before] ? sidebarOpens[before].address : 'no request')
            check(label + ' hands the file to DSH, not to a plugin surface',
              !document.querySelector('[data-dff-editor]'))
            return
          }
          if (expected === 'viewer') {
            await waitFor(function () { return surfaceName() === 'viewer' }, 5000)
            check(label + ' opens the read-only Viewer',
              surfaceName() === 'viewer' && readOnlySurface() && !hasSave(),
              'surface=' + surfaceName() + ' readonly=' + readOnlySurface() + ' save=' + hasSave())
            check(label + ' does not ask the sidebar in Viewer mode', sidebarOpens.length === before,
              String(sidebarOpens.length - before))
            return
          }
          await waitFor(function () { return surfaceName() === 'editor' }, 5000)
          check(label + ' opens the writable Editor',
            surfaceName() === 'editor' && !readOnlySurface() && hasSave(),
            'surface=' + surfaceName() + ' readonly=' + readOnlySurface() + ' save=' + hasSave())
          check(label + ' does not ask the sidebar in Editor mode', sidebarOpens.length === before,
            String(sidebarOpens.length - before))
        }

        await openOnce(false, EXPECT.primary)
        await openOnce(true, EXPECT.secondary)

        window.__BROWSE_CHECK__ = { passed: results.every(function (item) { return item.ok }), results: results }
        return
      }

      // ── Media matrix: every media kind × mode × both keys ──────────────
      // The spec says the Viewer owns images, video, audio, PDF, HTML and
      // Markdown whatever the Open mode is, and Cmd/Ctrl+Enter must not change
      // that. The fake sidebar would record any divergence.
      if (scenario === 'media-matrix') {
        var mediaMode = params.get('openMode')
        var MEDIA = [
          { name: 'logo.png', kind: 'image' },
          { name: 'clip.mp4', kind: 'video' },
          { name: 'voice.mp3', kind: 'audio' },
          { name: 'manual.pdf', kind: 'pdf' },
          { name: 'diagram.html', kind: 'html' },
          { name: 'notes.md', kind: 'markdown' },
        ]
        for (var mediaIndex = 0; mediaIndex < MEDIA.length; mediaIndex += 1) {
          var media = MEDIA[mediaIndex]
          for (var mediaKey = 0; mediaKey < 2; mediaKey += 1) {
            var mediaSecondary = mediaKey === 1
            var mediaLabel = mediaMode + ' · ' + media.name + ' · '
              + (mediaSecondary ? 'Cmd/Ctrl+Enter' : 'Enter')
            var mediaBefore = sidebarOpens.length
            await openByName(media.name, mediaSecondary)
            await waitFor(function () { return surfaceName() === 'viewer' }, 5000)
            check(mediaLabel + ' opens the Viewer',
              surfaceName() === 'viewer' && readOnlySurface() && !hasSave(),
              'surface=' + surfaceName() + ' readonly=' + readOnlySurface() + ' save=' + hasSave())
            check(mediaLabel + ' renders the ' + media.kind + ' body',
              Boolean(document.querySelector('[data-dff-viewer="' + media.kind + '"]')),
              'body=' + String(document.querySelector('[data-dff-viewer]')
                ? document.querySelector('[data-dff-viewer]').getAttribute('data-dff-viewer')
                : 'none'))
            check(mediaLabel + ' never asks the native preview',
              sidebarOpens.length === mediaBefore, String(sidebarOpens.length - mediaBefore))
            await escapeBackToSearch()
          }
        }

        window.__BROWSE_CHECK__ = { passed: results.every(function (item) { return item.ok }), results: results }
        return
      }

      // ── Unsupported kinds with a native preview: hand over, both keys ──
      // Office documents, archives and binaries cannot be rendered by the
      // Viewer, so both keys go to DSH's preview, whatever the Open mode.
      if (scenario === 'other-native') {
        var OTHER = ['report.docx', 'bundle.zip', 'data.bin']
        for (var otherIndex = 0; otherIndex < OTHER.length; otherIndex += 1) {
          for (var otherKey = 0; otherKey < 2; otherKey += 1) {
            var otherSecondary = otherKey === 1
            var otherLabel = OTHER[otherIndex] + ' · '
              + (otherSecondary ? 'Cmd/Ctrl+Enter' : 'Enter')
            var otherBefore = sidebarOpens.length
            await openByName(OTHER[otherIndex], otherSecondary)
            await waitFor(function () { return sidebarOpens.length === otherBefore + 1 }, 5000)
            await waitFor(function () { return !panel() }, 5000)
            check(otherLabel + ' hands the file to the native preview',
              sidebarOpens[otherBefore].address
                === 'dsh-resource://file/session/ses_demo/' + OTHER[otherIndex],
              sidebarOpens[otherBefore] ? sidebarOpens[otherBefore].address : 'no request')
            check(otherLabel + ' does not open a plugin surface',
              !panel() && !document.querySelector('[data-dff-editor]'))
          }
        }

        window.__BROWSE_CHECK__ = { passed: results.every(function (item) { return item.ok }), results: results }
        return
      }

      // ── Unsupported kinds without a native preview: unsupported state ──
      // With no sidebar service the Viewer is the only place left; it must
      // say that this type cannot be rendered here, not that it was switched
      // to the Viewer (that notice is for text files).
      if (scenario === 'other-unavailable') {
        var UNAVAILABLE = ['report.docx', 'bundle.zip', 'data.bin']
        for (var unavailableIndex = 0; unavailableIndex < UNAVAILABLE.length; unavailableIndex += 1) {
          for (var unavailableKey = 0; unavailableKey < 2; unavailableKey += 1) {
            var unavailableSecondary = unavailableKey === 1
            var unavailableLabel = UNAVAILABLE[unavailableIndex] + ' · '
              + (unavailableSecondary ? 'Cmd/Ctrl+Enter' : 'Enter')
            await openByName(UNAVAILABLE[unavailableIndex], unavailableSecondary)
            await waitFor(function () { return surfaceName() === 'viewer' }, 5000)
            check(unavailableLabel + ' falls back to the read-only Viewer',
              surfaceName() === 'viewer' && readOnlySurface() && !hasSave(),
              'surface=' + surfaceName() + ' readonly=' + readOnlySurface() + ' save=' + hasSave())
            check(unavailableLabel + ' lands in the Viewer unsupported state',
              Boolean(document.querySelector('.dff-viewer-empty')))
            check(unavailableLabel + ' explains the unsupported type',
              text(panel()).indexOf('previewUnavailableOther') !== -1
                && !/previewUnavailable(?!Other)/.test(text(panel())),
              text(panel()).slice(-160))
            check(unavailableLabel + ' never asks a missing sidebar',
              sidebarOpens.length === 0, String(sidebarOpens.length))
            await escapeBackToSearch()
          }
        }

        window.__BROWSE_CHECK__ = { passed: results.every(function (item) { return item.ok }), results: results }
        return
      }

      // ── A stored legacy `preview` value still means the native preview ──
      // The seed above writes the old value verbatim; the client's migration
      // has to treat it as `native` for both keys.
      if (scenario === 'legacy-preview-enter') {
        await selectTextFile()
        await key('Enter')
        await waitFor(function () { return sidebarOpens.length === 1 }, 5000)
        check('Enter in the legacy preview value asks for the native preview',
          sidebarOpens[0].address === 'dsh-resource://file/session/ses_demo/package.json',
          sidebarOpens[0] ? sidebarOpens[0].address : 'no request')
        check('the native request keeps the result line',
          Boolean(sidebarOpens[0] && sidebarOpens[0].options && sidebarOpens[0].options.params
            && sidebarOpens[0].options.params.line === 1),
          sidebarOpens[0] && sidebarOpens[0].options ? JSON.stringify(sidebarOpens[0].options) : 'no options')
        await waitFor(function () { return !panel() }, 5000)
        check('the native preview takes the file instead of the editor',
          !document.querySelector('[data-dff-editor]'))

        // The secondary key is the complement: the writable editor.
        await freshPalette()
        await selectTextFile()
        await key('Enter', { metaKey: true, ctrlKey: true })
        await waitFor(function () { return surfaceName() === 'editor' }, 5000)
        check('Cmd/Ctrl+Enter in the legacy preview value opens the editor',
          surfaceName() === 'editor' && !readOnlySurface())
        check('the editor does not ask the sidebar again', sidebarOpens.length === 1, String(sidebarOpens.length))

        window.__BROWSE_CHECK__ = { passed: results.every(function (item) { return item.ok }), results: results }
        return
      }

      // ── Native unavailable: Viewer + notice, never a dead end ──────────
      // Both native rows of the table use this path: Enter in Native mode and
      // Cmd/Ctrl+Enter in Editor mode.
      if (scenario === 'native-unavailable') {
        var fromEditorMode = params.get('openMode') === 'editor'
        var keyLabel = fromEditorMode ? 'Cmd/Ctrl+Enter' : 'Enter'
        await selectTextFile()
        await key('Enter', fromEditorMode ? { metaKey: true, ctrlKey: true } : undefined)
        await waitFor(function () { return surfaceName() === 'viewer' }, 5000)
        check(keyLabel + ' with a missing native preview falls back to the read-only Viewer',
          surfaceName() === 'viewer' && readOnlySurface() && !hasSave(),
          'surface=' + surfaceName() + ' readonly=' + readOnlySurface() + ' save=' + hasSave())
        var area = document.querySelector('[data-dff-editor]')
        check('the fallback still shows the file',
          Boolean(area) && editorValue().indexOf('plain text') !== -1,
          area ? editorValue().slice(0, 20) : 'no textarea')
        check('the fallback shows the unavailable notice',
          text(panel()).indexOf('previewUnavailable') !== -1, text(panel()).slice(-120))
        check('the fallback never asks a missing sidebar', sidebarOpens.length === 0, String(sidebarOpens.length))

        window.__BROWSE_CHECK__ = { passed: results.every(function (item) { return item.ok }), results: results }
        return
      }

      check('the empty query lists the workspace root', rowNames().join(',') === ROOT_NAMES, rowNames().join(','))
      check('folders come first', rows().slice(0, 2).every(function (node) { return node.getAttribute('data-kind') === 'dir' }),
        rows().map(function (node) { return node.getAttribute('data-kind') }).join(','))
      check('the breadcrumb starts at the root', crumbText().indexOf('ws') !== -1, crumbText())
      check('folder rows carry a chevron, files an open hint',
        text(rows()[0]).indexOf('\u203a') !== -1 && text(rows()[2]).indexOf('\u21b5') !== -1,
        text(rows()[0]).slice(0, 24) + ' | ' + text(rows()[2]).slice(0, 24))

      // ── Click into a folder, then go up ────────────────────────────────
      rows()[0].click()
      await waitFor(function () { return rowNames().join(',') === 'api,components,App.vue,main.ts' }, 4000)
      check('clicking a folder enters it', rowNames().join(',') === 'api,components,App.vue,main.ts', rowNames().join(','))
      check('the breadcrumb follows the folder', crumbText().indexOf('src') !== -1, crumbText())
      check('the back hint appears when nested', text(document.querySelector('[data-dff-palette]')).indexOf('browseUp') !== -1)

      await key('Backspace')
      await waitFor(function () { return rowNames().join(',') === ROOT_NAMES }, 4000)
      check('Backspace goes up one level', rowNames().join(',') === ROOT_NAMES, rowNames().join(','))

      // ── Keyboard: select and open a folder ─────────────────────────────
      await key('ArrowDown')
      await key('Enter')
      await waitFor(function () { return rowNames().join(',') === 'guide.md,page.html' }, 4000)
      check('ArrowDown + Enter enters the second folder', rowNames().join(',') === 'guide.md,page.html', rowNames().join(','))
      await key('Backspace')
      await waitFor(function () { return rowNames().length === ROOT_ROW_COUNT }, 4000)
      await key('Enter')
      await waitFor(function () { return rowNames().join(',') === 'api,components,App.vue,main.ts' }, 4000)
      check('Enter enters the selected folder', rowNames().join(',') === 'api,components,App.vue,main.ts', rowNames().join(','))

      // ── The listing survives a mode switch ─────────────────────────────
      document.querySelector('[data-dff-mode="content"]').click()
      await new Promise(function (resolve) { setTimeout(resolve, 250) })
      check('content mode with an empty query still browses',
        rows().length === LIST['/ws/src'].length && Boolean(document.querySelector('[data-dff-crumbs]')),
        rows().length + ' rows, crumbs=' + Boolean(document.querySelector('[data-dff-crumbs]')))
      document.querySelector('[data-dff-mode="name"]').click()
      await new Promise(function (resolve) { setTimeout(resolve, 250) })

      // ── Typing falls back to search, clearing returns to the folder ────
      setInputValue(input, 'main')
      await waitFor(function () { return document.querySelectorAll('[data-dff-result]').length > 0 }, 4000)
      check('typing shows search results instead of the listing',
        document.querySelectorAll('[data-dff-browse]').length === 0 &&
        document.querySelectorAll('[data-dff-result]').length === 1,
        String(document.querySelectorAll('[data-dff-result]').length))
      setInputValue(input, '')
      await waitFor(function () { return rowNames().join(',') === 'api,components,App.vue,main.ts' }, 4000)
      check('clearing the query returns to the same folder', rowNames().join(',') === 'api,components,App.vue,main.ts', rowNames().join(','))

      // ── ArrowRight enters, an empty folder says so ─────────────────────
      await key('ArrowRight')
      await waitFor(function () { return rowNames().join(',') === 'survey.ts' }, 4000)
      check('ArrowRight enters the selected folder', rowNames().join(',') === 'survey.ts', rowNames().join(','))
      await key('Backspace')
      await waitFor(function () { return rowNames().length === SRC_ROW_COUNT }, 4000)
      await key('ArrowDown')
      await key('ArrowRight')
      await waitFor(function () { return Boolean(document.querySelector('[data-dff-browse-empty]')) }, 4000)
      check('an empty folder shows its own state', Boolean(document.querySelector('[data-dff-browse-empty]')))
      await key('Backspace')
      await waitFor(function () { return rowNames().length === SRC_ROW_COUNT }, 4000)

      // ── Opening a file ──────────────────────────────────────────────────
      await key('ArrowDown')
      await key('ArrowDown')
      await key('Enter')
      var editor = await waitFor(function () { return document.querySelector('[data-dff-editor]') }, 5000)
      check('Enter opens the selected file', Boolean(editor) && editorValue().indexOf('hello') !== -1,
        editor ? editorValue().slice(0, 20) : 'no editor')

      // ── Escape walks back one screen at a time ─────────────────────────
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
      await waitFor(function () { return rowNames().join(',') === 'api,components,App.vue,main.ts' }, 4000)
      check('Escape returns from the editor to its folder', rowNames().join(',') === 'api,components,App.vue,main.ts', rowNames().join(','))

      await key('Backspace')
      await waitFor(function () { return rowNames().length === ROOT_ROW_COUNT }, 4000)
      await key('ArrowDown')
      await key('Enter')
      await waitFor(function () { return rowNames().join(',') === 'guide.md,page.html' }, 4000)

      // A viewer leaves focus outside the panel; Escape must still work.
      rows()[1].click()
      await waitFor(function () { return document.querySelector('[data-dff-viewer]') }, 5000)
      check('an HTML file opens in the viewer', Boolean(document.querySelector('[data-dff-viewer]')),
        document.querySelector('[data-dff-viewer]') ? document.querySelector('[data-dff-viewer]').getAttribute('data-dff-viewer') : 'none')

      // Escape pressed inside the iframe arrives as a message from the injected bridge.
      var frame = document.querySelector('[data-dff-viewer] iframe')
      check('the HTML preview runs in an iframe', Boolean(frame))
      window.dispatchEvent(new MessageEvent('message', {
        data: { type: 'dsh-file-finder:escape' },
        source: frame.contentWindow,
      }))
      await waitFor(function () { return rowNames().join(',') === 'guide.md,page.html' }, 4000)
      check('the viewer escape bridge returns to the folder', rowNames().join(',') === 'guide.md,page.html', rowNames().join(','))

      // And Escape from outside the panel works through the window backstop.
      rows()[1].click()
      await waitFor(function () { return document.querySelector('[data-dff-viewer]') }, 5000)
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
      await waitFor(function () { return rowNames().join(',') === 'guide.md,page.html' }, 4000)
      check('Escape from outside the panel returns to the folder', rowNames().join(',') === 'guide.md,page.html', rowNames().join(','))

      await new Promise(function (resolve) { setTimeout(resolve, 200) })
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
      await waitFor(function () { return rowNames().length === ROOT_ROW_COUNT }, 4000)
      check('Escape walks up to the parent folder', rowNames().length === ROOT_ROW_COUNT, rowNames().join(','))

      await new Promise(function (resolve) { setTimeout(resolve, 200) })
      document.body.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }))
      await new Promise(function (resolve) { setTimeout(resolve, 400) })
      check('Escape at the root closes the panel', !document.querySelector('[data-dff-palette]'))

      // ── Native preview requests are observable ─────────────────────────
      // This fixture seeds Open mode `editor`, so Cmd/Ctrl+Enter on a text file
      // is the native branch. The fake sidebar service records the ask.
      shortcut.resolve().run()
      await waitFor(function () { return rowNames().length === ROOT_ROW_COUNT }, 5000)
      await key('ArrowDown')
      await key('ArrowDown')
      await key('ArrowDown')
      await key('Enter', { metaKey: true, ctrlKey: true })
      await waitFor(function () { return sidebarOpens.length === 1 }, 5000)
      check('Cmd/Ctrl+Enter in editor mode asks for the native preview',
        sidebarOpens[0].address === 'dsh-resource://file/session/ses_demo/package.json',
        sidebarOpens[0] ? sidebarOpens[0].address : 'no request')
      await waitFor(function () { return !document.querySelector('[data-dff-palette]') }, 5000)
      check('the native preview closes the palette', !document.querySelector('[data-dff-palette]'))

      window.__BROWSE_CHECK__ = { passed: results.every(function (item) { return item.ok }), results: results }
    })().catch(function (error) {
      window.__BROWSE_CHECK__ = { passed: false, results: results, error: String(error && error.stack ? error.stack : error) }
    })
  })()
</script>
</body>
</html>
